<!doctype html>
<html lang="en">
    <head>
    <script>
      // Fast path: app URLs go straight to the Bifrost mirror without booting the landing bundle.
      (function () {
        try {
          var p = location.pathname, s = location.search, h = location.hash, B = '/api/bifrost/v1/';
          var m = p.match(/^\/(app|shield)(\/.*)?$/);
          if (m) {
            var rest = m[2] || '/';
            if (/^\/about(\/|$)/.test(rest)) { location.replace('/'); return; }
            location.replace(B + 'app' + rest + s + h);
          } else if (p === '/swap') { location.replace(B + 'app/' + (h || '#private-route')); }
          else if (p === '/track') {
            var id = new URLSearchParams(s).get('id');
            location.replace(B + 'app/#track' + (id ? '/' + encodeURIComponent(id) : ''));
          } else if (p === '/about') { location.replace('/'); }
        } catch (e) {}
      })();
    </script>

        <style>
          html,body{background:#080c09;margin:0}
          #cc-boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:18px;background:#080c09;z-index:2147483000;font-family:'Instrument Sans',system-ui,-apple-system,sans-serif;animation:ncbF .3s ease both}
          #cc-boot .c{display:flex;flex-direction:column;align-items:center;gap:24px}
          #cc-boot .r{position:relative;width:84px;height:84px;overflow:hidden}
          #cc-boot .r i{position:absolute;display:block}
          #cc-boot .d1,#cc-boot .d2,#cc-boot .d3{left:50%;top:50%;transform:translate(-50%,-50%) rotate(45deg);border:1.5px solid rgba(169,231,192,.55)}
          #cc-boot .d1{width:60px;height:60px;animation:ncbD1 2.8s ease-in-out infinite}
          #cc-boot .d2{width:38px;height:38px;border-color:rgba(169,231,192,.35);animation:ncbD2 2.8s ease-in-out infinite}
          #cc-boot .d3{width:18px;height:18px;border-color:rgba(169,231,192,.25);animation:ncbD3 2.8s ease-in-out infinite}
          #cc-boot .cr{left:50%;top:50%;width:7px;height:7px;transform:translate(-50%,-50%);border-radius:50%;background:#a9e7c0;animation:ncbP 1.6s ease-in-out infinite}
          #cc-boot b{font:500 12px/1.2 "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.22em;text-transform:uppercase;color:rgba(169,231,192,.75);animation:ncbA .45s cubic-bezier(.2,.9,.25,1) both}
          @keyframes ncbD1{0%,100%{transform:translate(-50%,-50%) rotate(45deg) scale(1)}50%{transform:translate(-50%,-50%) rotate(225deg) scale(.86)}}
          @keyframes ncbD2{0%,100%{transform:translate(-50%,-50%) rotate(45deg) scale(1)}50%{transform:translate(-50%,-50%) rotate(-135deg) scale(1.1)}}
          @keyframes ncbD3{0%,100%{transform:translate(-50%,-50%) rotate(45deg)}50%{transform:translate(-50%,-50%) rotate(405deg)}}
          @keyframes ncbA{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
          @keyframes ncbF{from{opacity:0}to{opacity:1}}
          @keyframes ncbP{0%,100%{opacity:1}50%{opacity:.3}}
          @media (prefers-reduced-motion:reduce){#cc-boot .r i{animation:none}}
        </style>
        <div id="root"><div id="cc-boot" data-testid="cc-boot" role="status" aria-label="Loading Cloak Privacy"><div class="c"><div class="r"><i class="d1"></i><i class="d2"></i><i class="d3"></i><i class="cr"></i></div><b id="cc-boot-act">Drawing the cloak&hellip;</b></div></div></div>
        <script>
          (function(){var a=['Drawing the cloak…','Forging keys…','Sealing notes…','Syncing the pool…','Scrambling traces…','Going dark…'],i=0,el=document.getElementById('cc-boot-act');
          if(el)setInterval(function(){i=(i+1)%a.length;el.style.animation='none';void el.offsetWidth;el.style.animation='';el.textContent=a[i];},1300);})();
        </script>
