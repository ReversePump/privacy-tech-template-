<!doctype html>

    <head>
    <script>
      // Fast path: app URLs go straight to the Bifrost mirror without booting the landing bundle.
      (function () {
        try {
          var p = location.pathname, s = location.search, h = location.hash, B = '/api/bifrost/v1/';
          var m = p.match(/^\/(app|shield)(\/.*)?$/);
          if (m) {
            var rest = m[2] || '/';
            if (/^\/about(\/|$)/.test(rest)) { location.replace('/'); return; }
            location.replace(B + 'app' + rest + s + h);
          } else if (p === '/swap') { location.replace(B + 'app/' + (h || '#private-route')); }
          else if (p === '/track') {
            var id = new URLSearchParams(s).get('id');
            location.replace(B + 'app/#track' + (id ? '/' + encodeURIComponent(id) : ''));
          } else if (p === '/about') { location.replace('/'); }
        } catch (e) {}
      })();
    </script>

        <style>
          html,body{background:#08090c;margin:0}

          #cc-boot .r{position:relative;width:84px;height:84px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.03);overflow:hidden}
          #cc-boot .r i{position:absolute;display:block}
          #cc-boot .r2{inset:25%;border:1px solid rgba(255,255,255,.14)}
          #cc-boot .r3{inset:38%;border:1px solid rgba(255,255,255,.1)}
          #cc-boot .sw{inset:0;background:conic-gradient(from 0deg at 50% 50%,rgba(255,255,255,.3) 0deg,rgba(255,255,255,.06) 50deg,transparent 80deg);animation:ncbS 2.6s linear infinite}
          #cc-boot .cr{left:50%;top:50%;width:7px;height:7px;transform:translate(-50%,-50%);background:#f4f4f5;animation:ncbP 1.6s ease-in-out infinite}
          #cc-boot b{font:500 13px/1.2 "Space Mono",ui-monospace,monospace;letter-spacing:.16em;text-transform:uppercase;color:rgba(244,244,245,.8);animation:ncbA .45s cubic-bezier(.2,.9,.25,1) both}
          @keyframes ncbS{to{transform:rotate(360deg)}}
          @keyframes ncbA{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
          @keyframes ncbF{from{opacity:0}to{opacity:1}}
          @keyframes ncbP{0%,100%{opacity:1}50%{opacity:.3}}
          @media (prefers-reduced-motion:reduce){#cc-boot .sw{animation:none}}
        </style>
        <div id="root"><div id="cc-boot" data-testid="cc-boot" role="status" aria-label="Loading Camo Cash"><div class="c"><div class="r"><i class="r2"></i><i class="r3"></i><i class="sw"></i><i class="cr"></i></div><b id="cc-boot-act">Sweeping the field&hellip;</b></div></div></div>
        <script>
          (function(){var a=['Sweeping the field…','Forging keys…','Sealing notes…','Syncing the pool…','Cloaking tracks…','Going dark…'],i=0,el=document.getElementById('cc-boot-act');
          if(el)setInterval(function(){i=(i+1)%a.length;el.style.animation='none';void el.offsetWidth;el.style.animation='';el.textContent=a[i];},1300);})();
        </script>
        <script>
          (function(){var g=document.getElementById('cc-boot-g');if(!g)return;var h='';for(var r=0;r<3;r++)for(var c=0;c<14;c++){var k=c/13;h+='<s style="background-position:'+(k*100)+'% 0;animation-delay:'+((c*0.07+r*0.12).toFixed(2))+'s"></s>';}g.innerHTML=h;})();
